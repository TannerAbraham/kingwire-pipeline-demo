spring:
  application:
    name: kingwire-pipeline-demo

  # Primary datasource — MySQL 8 (central harmonized datastore)
  # HikariCP pool tuning is handled in DataSourceConfig.java
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:kingwire_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate         # Flyway owns schema — Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 25  # batch lazy-load collections to reduce queries

  # Flyway — versioned schema migrations for MySQL primary datasource
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Elasticsearch — search index layer
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 10s

  # Disable auto-create for ES indices (managed via @Document settings)
  data:
    elasticsearch:
      repositories:
        enabled: true

# Actuator — expose health and metrics endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,caches
  endpoint:
    health:
      show-details: always

# Warehouse inventory REST API URL
# Leave blank to use synthetic data generation (default for local dev)
warehouse:
  api:
    url: ${WAREHOUSE_API_URL:}

# Logging
logging:
  level:
    com.kingwiredemo: INFO
    org.springframework.jdbc: DEBUG    # shows SQL in legacy JDBC template
    org.hibernate.SQL: WARN
